<script>window.react = window.React; window.__POSTS__ = [{"title": "I built 3 Instagram pages that post themselves", "slug": "instagram-pages-that-post-themselves", "date": "2026-10-28", "tag": "Automation", "excerpt": "RSS news in, designed posts out, twice a day, for under ₹800 a month. Here is the whole setup, step by step.", "html": "<p>I wanted a second income project that would not eat my evenings. So I built three Instagram pages that find their own content, design their own posts and publish on schedule:<\/p>\n<ul>\n<li><strong>GadgetChai<\/strong>: tech news for Indian readers<\/li>\n<li><strong>TeluguTalkiesDaily<\/strong>: Tollywood news, with English and Telugu captions<\/li>\n<li><strong>LolBiryani<\/strong>: Telugu memes<\/li>\n<\/ul>\n<p>Each page posts twice a day. My part is tapping a button on my phone when I want to approve something.<\/p>\n<h2>The stack<\/h2>\n<table>\n<thead>\n<tr>\n<th>Piece<\/th>\n<th>Job<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>n8n (self-hosted on my MacBook)<\/td>\n<td>Runs every workflow on a schedule<\/td>\n<\/tr>\n<tr>\n<td>RSS feeds<\/td>\n<td>Fresh news for the two news pages<\/td>\n<\/tr>\n<tr>\n<td>Claude API<\/td>\n<td>Picks the best story, writes headline, caption and hashtags<\/td>\n<\/tr>\n<tr>\n<td>Cloudinary<\/td>\n<td>Builds the post image from a branded template, using only a URL<\/td>\n<\/tr>\n<tr>\n<td>Instagram Graph API<\/td>\n<td>Uploads and publishes the post<\/td>\n<\/tr>\n<tr>\n<td>Telegram bot<\/td>\n<td>Sends me a preview with Approve / Skip buttons<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Total running cost: well under ₹800 a month.<\/p>\n<h2>How one post gets made<\/h2>\n<ol>\n<li><strong>Read the feeds.<\/strong> Every few hours n8n pulls the latest stories and drops anything older than 24 hours or already posted.<\/li>\n<li><strong>Let AI pick.<\/strong> Claude gets the shortlist and returns JSON: which story, a headline under 65 characters, a short subline, a caption and hashtags. It is told to use only facts from the story and never invent numbers.<\/li>\n<li><strong>Build the image.<\/strong> Cloudinary can write text onto an image just from the URL, so the \"design\" step is just string building: background template + headline layer + subline layer.<\/li>\n<li><strong>Ask me.<\/strong> If the article has a real photo, I get a Telegram message with two versions and buttons. No tap in 90 minutes means the safe designed version posts.<\/li>\n<li><strong>Publish.<\/strong> Two calls to Instagram: create the media container, wait 20 seconds, publish.<\/li>\n<\/ol>\n<h2>Lessons that cost me a day each<\/h2>\n<ul>\n<li><strong>Escape your text for Cloudinary.<\/strong> Commas, slashes and colons inside text layers must be double-encoded (<code>%252C<\/code>, <code>%252F<\/code>, <code>%253A<\/code>) or the image breaks.<\/li>\n<li><strong>Your laptop sleeps.<\/strong> Runs failed with \"connection aborted\" until I kept the Mac awake and added retries with timeouts.<\/li>\n<li><strong>Check the time zone after importing a workflow.<\/strong> Mine silently fell back to US time, so posts went out at 4:30 AM. (Separate post on that one.)<\/li>\n<li><strong>Tokens expire.<\/strong> Instagram tokens last 60 days. A small workflow now renews them on the 1st and 15th of every month and tells me on Telegram.<\/li>\n<\/ul>\n<h2>What's next<\/h2>\n<p>Auto-generated Reels, a weekly OTT guide and turning the same engine into a service for local businesses.<\/p>\n<p>If you want to build something similar, message me. Happy to help.<\/p>", "mins": 2}, {"title": "Why my pages were posting at 4:30 AM", "slug": "n8n-timezone-bug", "date": "2026-10-24", "tag": "Automation", "excerpt": "An n8n import quietly dropped my time zone setting. How I found it from the logs, and the 2-minute fix.", "html": "<p>My automated Instagram pages looked fine for a week. Then I noticed two things: some runs were failing, and the posts that did go out had very low reach.<\/p>\n<h2>The symptoms<\/h2>\n<p>The error log was full of network errors:<\/p>\n<ul>\n<li>\"The connection was aborted, perhaps the server is offline\" (56 times)<\/li>\n<li>\"timeout of 60000ms exceeded\" (54 times)<\/li>\n<li>\"getaddrinfo ENOTFOUND api.anthropic.com\" (14 times)<\/li>\n<\/ul>\n<p>That points to the machine losing internet, which happens when a laptop sleeps. But why was it asleep during posting time?<\/p>\n<h2>Reading the run history<\/h2>\n<p>n8n stores every run with a start time. Lining them up against my schedule showed a pattern. Every run was exactly <strong>9 hours 30 minutes<\/strong> off from what I had set, and every failure landed between 4:30 and 6:00 AM IST.<\/p>\n<table>\n<thead>\n<tr>\n<th>Page<\/th>\n<th>Scheduled (IST)<\/th>\n<th>Actually ran (IST)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>TeluguTalkiesDaily<\/td>\n<td>10:00 and 19:00<\/td>\n<td>19:30 and 04:30<\/td>\n<\/tr>\n<tr>\n<td>LolBiryani<\/td>\n<td>12:30 and 20:30<\/td>\n<td>22:00 and 06:00<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>India is UTC+5:30 and New York is UTC−4. That gap is 9 hours 30 minutes. My cron expressions were being read in <strong>New York time<\/strong>.<\/p>\n<h2>The cause<\/h2>\n<p>When you import a workflow JSON into n8n, the <code>timezone<\/code> in the workflow settings is not kept. With no time zone set, n8n uses its default, which on my install was America/New_York.<\/p>\n<h2>The fix<\/h2>\n<ol>\n<li>Open the workflow → <strong>⋯<\/strong> next to its name → <strong>Settings<\/strong>.<\/li>\n<li>Set <strong>Timezone<\/strong> to <strong>Asia/Kolkata<\/strong> and click <strong>Save<\/strong> inside the pop-up.<\/li>\n<li><strong>Unpublish and publish<\/strong> the workflow again so the schedule is re-registered.<\/li>\n<\/ol>\n<p>Two gotchas: the pop-up has its own Save button, and saving settings does not enable the Publish button, because settings are not a new version. Unpublish and publish forces the schedule to restart.<\/p>\n<h2>Takeaway<\/h2>\n<p>After every import, check three things: credentials are linked, the time zone is set, and the workflow is published. And when something fails \"randomly\", line the failures up against the clock. Random failures are rarely random.<\/p>", "mins": 2}, {"title": "Teaching an AI to write funnier Telugu memes", "slug": "ai-funnier-telugu-memes", "date": "2026-10-24", "tag": "AI", "excerpt": "My meme page's jokes were flat. Asking for \"a funny meme\" was the problem. Drafting six, scoring them and picking one fixed it.", "html": "<p>LolBiryani is my fully automated Telugu meme page. For the first two weeks, the jokes were... polite. Here's a real one it posted:<\/p>\n<blockquote>\n<p>Nobody: / Amma, fridge lo 2 spoons kura: / \"Pareyaku ra, repu kosam untundi\"<\/p>\n<\/blockquote>\n<p>It's true, but it isn't funny. There's no twist.<\/p>\n<h2>What was wrong with the prompt<\/h2>\n<p>I had asked for \"one original, genuinely funny meme\". That gave the model nothing to aim at. It picked the safest format (\"Nobody:\") every time, described a situation, then added an extra line that explained the joke.<\/p>\n<h2>What changed<\/h2>\n<p><strong>1. Say what makes a joke work.<\/strong> The prompt now spells it out: the punchline must be a twist the reader doesn't see coming; specific Telugu details beat general ones; one idea, readable in 2 seconds; never explain the joke.<\/p>\n<p><strong>2. Show bad and good examples.<\/strong> I used my page's own weak posts as the \"bad\" examples, with a one-line reason each. Then a few good ones at the level I wanted.<\/p>\n<p><strong>3. Force variety.<\/strong> Six named formats: dialogue twist, \"Amma dictionary\", expectation vs reality, before/after, fake notification, honest confession. \"Nobody:\" is banned.<\/p>\n<p><strong>4. Draft, score, pick.<\/strong> The model writes six drafts, one per format, and scores each from 1 to 10 on twist, specificity, speed and shareability. A joke with no twist must score below 5. Only the winner gets posted.<\/p>\n<h2>The result<\/h2>\n<p>The first meme from the new prompt:<\/p>\n<blockquote>\n<p>Nanna: Crackers lo bhayam ledu ra / Nanna: Andaru dooram ga nilchondi\n→ Rocket veliginchi Nanna andari kanna mundu 3rd floor ekkesadu<\/p>\n<\/blockquote>\n<p>That one has a real reversal, it's a scene every family knows, and it fit Diwali two weeks out.<\/p>\n<h2>Two practical notes<\/h2>\n<ul>\n<li>Six drafts take more time. My API call needed its timeout raised from 60 to 180 seconds.<\/li>\n<li>Even good prompts miss sometimes, so the meme now comes to my phone first with <strong>Post / Skip / Write another<\/strong> buttons. If I don't tap within an hour, it posts.<\/li>\n<\/ul>\n<p>The general lesson works beyond memes: don't ask the model for \"good\". Tell it what good means, show it, make it produce options, and make it judge them.<\/p>", "mins": 2}, {"title": "SQL window functions, explained for beginners", "slug": "sql-window-functions-beginners", "date": "2026-10-20", "tag": "SQL", "excerpt": "GROUP BY squashes rows. Window functions keep every row and add the calculation beside it. Four examples you'll actually use.", "html": "<p>When I teach SQL to beginners, window functions are the topic where people go from \"I can write queries\" to \"I can answer real questions\". Here's the idea in one line:<\/p>\n<p><strong>GROUP BY collapses rows into one per group. A window function keeps every row and adds a calculated column next to it.<\/strong><\/p>\n<p>We'll use one small table, <code>orders<\/code>:<\/p>\n<table>\n<thead>\n<tr>\n<th>order_id<\/th>\n<th>customer<\/th>\n<th>order_date<\/th>\n<th>amount<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Ravi<\/td>\n<td>2026-10-01<\/td>\n<td>500<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Sita<\/td>\n<td>2026-10-02<\/td>\n<td>1200<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Ravi<\/td>\n<td>2026-10-05<\/td>\n<td>300<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Sita<\/td>\n<td>2026-10-07<\/td>\n<td>800<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Ravi<\/td>\n<td>2026-10-09<\/td>\n<td>900<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>1. Each customer's total, on every row<\/h2>\n<pre><code class=\"language-sql\">SELECT order_id, customer, amount,\n       SUM(amount) OVER (PARTITION BY customer) AS customer_total\nFROM orders;\n<\/code><\/pre>\n<p><code>PARTITION BY<\/code> is like GROUP BY, but the rows stay. Ravi's three orders all show <code>1700<\/code>.<\/p>\n<h2>2. Running total over time<\/h2>\n<pre><code class=\"language-sql\">SELECT order_id, customer, order_date, amount,\n       SUM(amount) OVER (PARTITION BY customer ORDER BY order_date) AS running_total\nFROM orders;\n<\/code><\/pre>\n<p>Adding <code>ORDER BY<\/code> inside <code>OVER<\/code> makes it cumulative: Ravi goes 500 → 800 → 1700.<\/p>\n<h2>3. Rank each customer's orders<\/h2>\n<pre><code class=\"language-sql\">SELECT order_id, customer, amount,\n       ROW_NUMBER() OVER (PARTITION BY customer ORDER BY amount DESC) AS rn\nFROM orders;\n<\/code><\/pre>\n<p>Wrap it in a subquery or CTE and keep <code>rn = 1<\/code> to get <strong>each customer's biggest order<\/strong>, one of the most asked interview questions.<\/p>\n<h2>4. Compare with the previous order<\/h2>\n<pre><code class=\"language-sql\">SELECT order_id, customer, order_date, amount,\n       amount - LAG(amount) OVER (PARTITION BY customer ORDER BY order_date) AS change_from_last\nFROM orders;\n<\/code><\/pre>\n<p><code>LAG<\/code> looks one row back in the window. The first order per customer gets <code>NULL<\/code> because there is nothing before it.<\/p>\n<h2>Cheat sheet<\/h2>\n<table>\n<thead>\n<tr>\n<th>You want<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Group total on every row<\/td>\n<td><code>SUM() OVER (PARTITION BY …)<\/code><\/td>\n<\/tr>\n<tr>\n<td>Running total<\/td>\n<td><code>SUM() OVER (PARTITION BY … ORDER BY …)<\/code><\/td>\n<\/tr>\n<tr>\n<td>Top N per group<\/td>\n<td><code>ROW_NUMBER()<\/code> in a CTE, then filter<\/td>\n<\/tr>\n<tr>\n<td>Ties share a rank<\/td>\n<td><code>RANK()<\/code> or <code>DENSE_RANK()<\/code><\/td>\n<\/tr>\n<tr>\n<td>Previous / next row<\/td>\n<td><code>LAG()<\/code> / <code>LEAD()<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Practice: try writing \"each customer's share of their own total\" using example 1. Answer: <code>amount * 100.0 / SUM(amount) OVER (PARTITION BY customer)<\/code>.<\/p>", "mins": 2}];</script>

const CSS = `
html{scroll-behavior:smooth}
.has-cursor, .has-cursor *{cursor:none!important}
.cur-dot,.cur-ring{position:fixed;left:0;top:0;pointer-events:none;z-index:100;opacity:0;transition:opacity .3s}
.cur-on .cur-dot,.cur-on .cur-ring{opacity:1}
.cur-dot{width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;mix-blend-mode:difference}
.cur-ring{width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:#fff;mix-blend-mode:difference;transition:width .3s,height .3s,margin .3s,opacity .3s;display:grid;place-items:center}
.cur-ring span{font:600 11px/1 Inter,system-ui,sans-serif;color:#000;opacity:0;transition:opacity .2s;text-transform:uppercase;letter-spacing:.08em}
.cur-ring.big{width:72px;height:72px;margin:-36px 0 0 -36px}
.cur-ring.text{width:88px;height:88px;margin:-44px 0 0 -44px;mix-blend-mode:normal;background:#0a0a0a}
.cur-ring.text span{opacity:1;color:#fff}
@media (hover:none),(pointer:coarse){.cur-dot,.cur-ring{display:none}}
.magnet{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.pill{position:relative;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;border-radius:999px;border:1px solid #d4d4d4;background:#fff;color:#0a0a0a;font-weight:500;isolation:isolate}
.pill::before{content:"";position:absolute;left:var(--x,50%);top:var(--y,50%);width:0;height:0;border-radius:50%;background:#0a0a0a;transform:translate(-50%,-50%);transition:width .5s cubic-bezier(.2,.8,.2,1),height .5s cubic-bezier(.2,.8,.2,1);z-index:-1}
.pill:hover::before{width:260%;height:600%}
.pill:hover{color:#fff;border-color:#0a0a0a}
.pill-label{display:inline-flex;align-items:center;transition:color .3s}
.pill-dark{background:#0a0a0a;color:#fff;border-color:#0a0a0a}
.pill-dark::before{background:#FFB020}
.pill-dark:hover{color:#0a0a0a;border-color:#FFB020}
.pill:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #FFB020;outline-offset:3px}
@keyframes lineUp{from{transform:translateY(45%);opacity:.15}to{transform:none;opacity:1}}
.hero-line{overflow:hidden;padding-bottom:.04em}
.hero-line>span{display:inline-block;animation:lineUp 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:inherit}
.hero-in{animation:lineUp .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes chipIn{from{transform:translateY(100%)}to{transform:none}}
.chip-line{animation:chipIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes glow{to{transform:translateX(-25%) scale(1.2)}}
.chip-glow{animation:glow 4s ease-in-out infinite alternate}
@keyframes marquee{to{transform:translateX(-50%)}}
.marquee{animation:marquee 32s linear infinite}
.svc::before{content:"";position:absolute;inset:0;background:#0a0a0a;transform:scaleY(0);transform-origin:bottom;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.svc:hover::before{transform:scaleY(1)}
@media (hover:none){.svc::before{display:none}.svc:hover *{color:inherit!important}}
.work-preview{opacity:0;transition:opacity .3s, scale .3s;scale:.85}
.work-preview.on{opacity:1;scale:1}
[data-reveal]{transition:transform .9s cubic-bezier(.2,.8,.2,1)}
[data-reveal].pre{transform:translateY(40px)}
.menu{clip-path:circle(0% at calc(100% - 60px) 48px);transition:clip-path .7s cubic-bezier(.7,0,.2,1);visibility:hidden}
.menu.open{clip-path:circle(150% at calc(100% - 60px) 48px);visibility:visible}
.menu-link{transform:translateY(30px);opacity:0;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .6s}
.menu.open .menu-link{transform:none;opacity:1}
@keyframes modalIn{from{transform:translateY(24px) scale(.98)}to{transform:none}}
.modal-in{animation:modalIn .35s cubic-bezier(.2,.8,.2,1)}
.prose-lite h2{font-size:1.25rem;font-weight:600;margin:1.8em 0 .5em;color:#0a0a0a}
.prose-lite p,.prose-lite li{line-height:1.7;margin:.6em 0;color:#404040}
.prose-lite ul,.prose-lite ol{padding-left:1.3em;list-style:revert}
.prose-lite blockquote{border-left:3px solid #FFB020;padding:.4em 1em;margin:1em 0;background:#fafafa;border-radius:0 10px 10px 0}
.prose-lite code{font-family:'JetBrains Mono',monospace;font-size:.86em;background:#f4f4f5;padding:.1em .35em;border-radius:5px}
.prose-lite pre{background:#0a0a0a;color:#e5e5e5;padding:1em;border-radius:12px;overflow-x:auto}
.prose-lite pre code{background:none;color:inherit;padding:0}
.prose-lite table{width:100%;border-collapse:collapse;font-size:.92rem;display:block;overflow-x:auto}
